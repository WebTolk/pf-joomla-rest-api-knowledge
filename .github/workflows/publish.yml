name: Publish knowledge release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already set in bundle.json and package manifests
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-knowledge-stable
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python -m pip install -r requirements.txt
      - run: python tools/build_release.py --version "$RELEASE_VERSION"
      - run: python tools/check_bundle.py
      - name: Publish immutable release artifacts
        run: |
          tag="v$RELEASE_VERSION"
          gh release create "$tag" --target "$GITHUB_SHA" --title "Joomla REST knowledge $tag" --notes-file CHANGELOG.md .dist/"$RELEASE_VERSION"/*.zip .dist/"$RELEASE_VERSION"/SHA256SUMS
      - name: Publish stable update pointer after artifacts
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git add updates/joomla-rest-api.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish knowledge update server $RELEASE_VERSION"
            git push origin HEAD:main
          fi
